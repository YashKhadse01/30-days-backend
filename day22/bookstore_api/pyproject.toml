[project]
name = "bookstore-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
    "schemathesis>=4.33.4",
]
[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]
[tool.ruff.lint]
ignore = ["RUF012"]
