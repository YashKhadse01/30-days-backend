[project]
name = "oauth-by-hand"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YashKhadse01", email = "yashmkhadse@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
oauth-by-hand = "oauth_by_hand:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
]
