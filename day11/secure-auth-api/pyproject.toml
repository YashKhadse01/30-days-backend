[project]
name = "secure-auth-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YashKhadse01", email = "yashmkhadse@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
secure-auth-api = "secure_auth_api:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.4",
]
[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
