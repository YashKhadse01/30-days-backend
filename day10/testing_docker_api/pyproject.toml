[project]
name = "testing-docker-api"
version = "0.1.0"
description = "A production-oriented FastAPI testing project featuring asynchronous PostgreSQL integration, pytest-asyncio, isolated database transactions, reusable test factories, Docker Compose, and code coverage."
readme = "README.md"
authors = [
    { name = "YashKhadse01", email = "yashmkhadse@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.7",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
testing-docker-api = "testing_docker_api:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.7",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
]
