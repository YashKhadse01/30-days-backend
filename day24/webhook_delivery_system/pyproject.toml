
[project]
name = "webhook-delivery-system"
version = "0.1.0"
description = "Reliable outgoing webhooks using Django REST Framework, Celery, Redis, HMAC-SHA256 signatures, retries, and delivery logging."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.7.0",
    "django>=5.2.19",
    "django-celery-beat>=2.9.0",
    "djangorestframework>=3.18.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
exclude = ["**/migrations/*.py"]
[tool.uv]
managed = true
[tool.uv.workspace]
members = []