[project]
name = "capstone-core"
version = "0.1.0"
description = "Advanced FastAPI backend capstone with authentication, Redis, Celery, OAuth, and API security"
readme = "README.md"
authors = [
    { name = "YashKhadse01", email = "yashmkhadse@gmail.com" }
]
requires-python = ">=3.12, <3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.10",
    "celery>=5.7.0",
    "cryptography>=50.0.2",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pyotp>=2.12.1",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
concurrency = ["greenlet"]
source = ["capstone_core"]
