[python-concurrency-http]
name = "concurrency-project"
version = "0.1.0"
description = "A Python backend development project exploring concurrency, multithreading, asynchronous programming, HTTP requests and responses, and network communication fundamentals."
readme = "README.md"
authors = [
    { name = "YashKhadse01", email = "yashmkhadse@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
concurrency-project = "concurrency_project:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
