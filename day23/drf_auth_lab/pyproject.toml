[project]
name = "drf-auth-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.18.3",
    "pyjwt>=2.15.1",
    "pyotp>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]
[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]