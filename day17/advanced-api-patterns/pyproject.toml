[project]
name = "advanced-api-patterns"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YashKhadse01", email = "yashmkhadse@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
advanced-api-patterns = "advanced_api_patterns:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
]
