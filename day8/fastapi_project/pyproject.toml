[fastapi-api-design]
name = "fastapi-project"
version = "0.1.0"
description = "A modular REST API built with Python and FastAPI, featuring Pydantic request validation, OpenAPI 3.0.3 specifications, Swagger UI documentation, reusable API routers, and automated testing with pytest."
readme = "README.md"
authors = [
    { name = "YashKhadse01", email = "yashmkhadse@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[project.scripts]
fastapi-project = "fastapi_project:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
]
